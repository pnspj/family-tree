<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>family-tree layout prototype</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
      #app { display: flex; flex-direction: column; height: 100%; }
      header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
      nav button { padding: 6px 10px; border: 1px solid #aaa; background: #fff; border-radius: 6px; cursor: pointer; }
      nav button.active { background: #1f2937; color: #fff; }
      #note { margin: 4px 12px; color: #555; font-size: 13px; }
      #stage { flex: 1; min-height: 0; background: #fafafa; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
